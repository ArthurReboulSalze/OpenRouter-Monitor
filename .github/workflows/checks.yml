name: Python checks (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install catalog dependency
        run: python -m pip install "requests>=2.31.0"
      - name: Run catalog tests
        run: python -m unittest discover -s tests -v
      - name: Check Python sources
        run: python -m py_compile openrouter_monitor_gui.py model_catalog.py monitor_theme.py build.py build_installer.py run.py tests/test_catalog.py
